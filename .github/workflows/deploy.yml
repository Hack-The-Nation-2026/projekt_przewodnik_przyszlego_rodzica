name: Deploy API to FastAPI Cloud

on:
  push:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-uv v10.3.2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "latest-known"
      # Aplikacja siedzi w back/, a nie w korzeniu repozytorium, więc deploy
      # uruchamiamy z tego katalogu. Reszta bez zmian wobec tego, co generuje
      # `fastapi cloud setup-ci`.
      - run: uv run fastapi deploy
        working-directory: back
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
