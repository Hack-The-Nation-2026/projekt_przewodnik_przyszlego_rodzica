[project]
name = "przewodnik-rodzica-api"
version = "0.1.0"
description = "REST API dla Zasilkowego Przewodnika Przyszlego Rodzica (HackNation 2026, ZUS)"
# Wersja przypięta przez `requires-python` razem z plikiem `.python-version`: cały
# zespół i FastAPI Cloud mają tę samą gałąź Pythona, więc zależności złożone
# (uvloop, httptools) mają gotowe koła i nie próbują się budować ze źródeł.
requires-python = ">=3.11,<3.15"
# Ten sam zestaw co w requirements.txt. FastAPI Cloud czyta zależności stąd,
# więc zmieniając jedną listę, zmień drugą.
dependencies = [
  "fastapi[standard]>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

# Bez tego `uv sync` próbuje zbudować projekt jako pakiet, a katalog nie ma nazwy zgodnej
# z nazwą projektu. FastAPI Cloud instaluje projekt po swojemu i to działa niezależnie.
[tool.uv]
package = false

# Wejście aplikacji podane wprost, żeby wdrożenie nie zależało od autodetekcji.
[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
