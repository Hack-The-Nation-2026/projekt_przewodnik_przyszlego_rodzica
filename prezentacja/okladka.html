<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Skrzydła Rodzica, okładka zgłoszenia</title>
<style>
  /* Okładka zgłoszenia: jedno zdjęcie, które mówi, o co chodzi w projekcie.
     Po lewej nazwa i obietnica, po prawej rodzina, a między nimi ekran
     aplikacji, czyli dowód, że to działa. 800 na 600 pikseli, 4:3. */
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("assets/plex-latin.woff2") format("woff2");
    font-weight: 100 700;
    font-style: normal;
    font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("assets/plex-latin-ext.woff2") format("woff2");
    font-weight: 100 700;
    font-style: normal;
    font-display: block;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    --ink: #1d2b3a;
    --soft: #5b6a63;
    --green: #007834;
    --rule: #dfe4e1;
    --tint: #f3f7f4;
  }

  * { box-sizing: border-box; margin: 0; }
  body { width: 800px; height: 600px; overflow: hidden; background: #fff; }

  .card {
    position: relative;
    width: 800px;
    height: 600px;
    background: #fff;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .photo { position: absolute; inset: 0 0 0 auto; width: 372px; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 88% 42%; }
  /* Zdjęcie wchodzi miękko w białą kartkę, żeby kadr nie kończył się linią. */
  .photo .fade {
    position: absolute; inset: 0 auto 0 0; width: 90px;
    background: linear-gradient(90deg, #fff 0%, rgba(255, 255, 255, 0) 100%);
  }

  .inner { position: relative; z-index: 2; padding: 46px 0 0 52px; width: 520px; }

  .mark { display: flex; align-items: center; gap: 11px; color: var(--green); }
  .mark svg { width: 34px; height: 34px; flex: none; }
  .mark span { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }

  h1 { margin-top: 20px; font-size: 33px; line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; }

  .rule { width: 58px; height: 4px; background: var(--green); margin: 16px 0 14px; }

  .lead { font-size: 15.5px; line-height: 1.42; color: var(--soft); width: 400px; }
  .lead strong { color: var(--ink); font-weight: 600; }

  /* Ekran aplikacji wystaje poza dolną krawędź, jak podgląd prawdziwego serwisu. */
  .frame {
    position: absolute;
    left: 46px;
    top: 336px;
    width: 486px;
    border: 1px solid var(--rule);
    border-radius: 10px 10px 0 0;
    border-bottom: 0;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 18px 40px rgba(29, 43, 58, 0.16);
  }
  .frame-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 11px; background: var(--tint); border-bottom: 1px solid var(--rule);
  }
  .frame-dots { display: flex; gap: 5px; }
  .frame-dots i { width: 7px; height: 7px; border-radius: 50%; background: #cfd8d3; }
  .frame-url {
    flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-size: 11.5px; color: var(--soft); background: #fff;
    border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px;
  }
  .frame img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="card">
  <div class="inner">
    <div class="mark">
      <svg viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M92.438 28.97C75.263 47.722 60.826 69.69 49.593 94L167.5 204.656l-12.78 13.625L41.905 112.407c-9.19 24.257-15.377 50.455-18.156 77.844l116.156 58.72l-8.437 16.686L22.312 210.47c-.963 24.45.777 49.666 5.437 75.155l100.53 8.313l-1.53 18.625l-94.97-7.844c.743 3.09 1.515 6.185 2.345 9.28c4.43 16.51 9.94 32.34 16.375 47.438c8.757-1.615 17.808-3.274 27.813-5.157c26.754-5.033 53.093-10.06 53.093-10.06l3.5 18.342s-26.368 5.054-53.156 10.094c-8.012 1.508-15.797 2.97-23.188 4.344c8.65 17.507 18.62 33.887 29.657 49l60.843-34.28L158.22 410l-58.407 32.938c12.202 14.79 25.482 28.186 39.624 40l17.157-20.344c1.38-20.537 4.963-37.725 14.375-51.72c6.338-9.425 15.44-16.826 27.155-21.937C189.86 376.115 183.3 361.62 179 345.594c-14.526-54.15.58-108.49 36.406-138.094L92.436 28.97zm238.405-28.97L300.314 207.5c35.826 29.604 50.964 83.943 36.437 138.094c-4.26 15.877-10.768 30.237-18.938 42.97c12.345 5.384 21.554 13.502 27.5 23.655c7.81 13.333 10.495 29.117 11.407 47.467l19.592 23.25c14.14-11.813 27.423-25.208 39.625-40L357.5 410l9.188-16.28L427.53 428c11.04-15.117 21.006-31.49 29.658-49c-7.4-1.374-15.207-2.836-23.22-4.344c-26.787-5.04-53.156-10.094-53.156-10.094l3.5-18.343s26.372 5.027 53.125 10.06a8378 8378 0 0 0 27.813 5.19a357 357 0 0 0 16.375-47.47c.83-3.095 1.602-6.19 2.344-9.28L389 312.56l-1.53-18.625l100.53-8.31c4.66-25.49 6.37-50.705 5.406-75.156L384.25 265.655l-8.438-16.687L492 190.25c-2.783-27.4-8.956-53.61-18.156-77.875L361.03 218.28l-12.81-13.624L466.124 94c-11.236-24.31-25.668-46.277-42.844-65.03z"/></svg>
      <span>Skrzydła Rodzica</span>
    </div>
    <h1>Zasiłkowy Przewodnik Przyszłego Rodzica</h1>
    <div class="rule"></div>
    <p class="lead">Rodzic odpowiada na kilkanaście pytań i widzi, <strong>co mu przysługuje, przez ile dni i w jakiej kwocie</strong> oraz gdzie złożyć wniosek.</p>
  </div>

  <div class="photo">
    <img src="assets/okladka-foto.jpg" alt="Mama i tata z niemowlakiem na łóżku">
    <div class="fade"></div>
  </div>

  <div class="frame">
    <div class="frame-bar">
      <span class="frame-dots"><i></i><i></i><i></i></span>
      <span class="frame-url">skrzydla-rodzica.vercel.app/kalkulator</span>
    </div>
    <img src="assets/okladka-ekran.png" alt="Wynik sprawdzenia w kalkulatorze świadczeń">
  </div>
</div>
</body>
</html>
